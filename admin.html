<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel · Médico a Domicilio</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="loginView" class="login-box">
  <h2>Iniciar sesión</h2>
  <form id="loginForm">
    <div class="field">
      <label for="email">Correo</label>
      <input type="email" id="email" required>
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" required>
    </div>
    <button type="submit" class="btn btn-primary submit-btn">Entrar</button>
    <div id="loginFeedback"></div>
  </form>
</div>

<div id="dashboardView" class="admin-wrap" style="display:none;">
  <div class="top-bar">
    <h2>Solicitudes</h2>
    <button class="logout" id="logoutBtn">Cerrar sesión</button>
  </div>

  <div class="filters" id="filters">
    <button data-filter="todas" class="active">Todas</button>
    <button data-filter="pendiente">Pendientes</button>
    <button data-filter="confirmado">Confirmadas</button>
    <button data-filter="en_camino">En camino</button>
    <button data-filter="completado">Completadas</button>
    <button data-filter="cancelado">Canceladas</button>
  </div>

  <div class="card-list" id="cardList"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
