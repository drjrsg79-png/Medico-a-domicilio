
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Médico · Médico a Domicilio</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="loginView" class="login-box">
  <h2>Iniciar sesión</h2>
  <p class="hint" style="margin-bottom:16px;">Panel para médicos aprobados.</p>
  <form id="loginForm">
    <div class="field">
      <label for="email">Correo</label>
      <input type="email" id="email" required>
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" required>
    </div>
    <button type="submit" class="btn btn-primary submit-btn">Entrar</button>
    <div id="loginFeedback"></div>
  </form>
</div>

<div id="pendingView" class="admin-wrap" style="display:none;">
  <div class="empty">
    <h3 style="margin-bottom:10px;">Tu cuenta está en revisión</h3>
    <p>Te avisaremos por correo en cuanto sea aprobada.</p>
  </div>
  <div style="text-align:center;">
    <button class="logout" id="logoutBtnPending">Cerrar sesión</button>
  </div>
</div>

<div id="dashboardView" class="admin-wrap" style="display:none;">
  <div class="top-bar">
    <h2 id="doctorName">Solicitudes</h2>
    <button class="logout" id="logoutBtn">Cerrar sesión</button>
  </div>

  <div class="filters" id="filters">
    <button data-filter="disponibles" class="active">Disponibles</button>
    <button data-filter="mias">Mis solicitudes</button>
  </div>

  <div class="card-list" id="cardList"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/doctor.js"></script>
</body>
</html>
